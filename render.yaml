# One-click config for Render's free tier.
#
#   render.com → New → Blueprint → point at this repo
#
# Notes that matter:
#   · No PORT is set here on purpose. Render injects one, and `next start`
#     honours it. Pinning a port is the usual reason a deploy never responds.
#   · Do NOT set NODE_ENV=production here. npm would then skip
#     devDependencies, and the build needs typescript and @types to compile.
#   · Do NOT run server.mjs in production — that is the local host with a
#     self-signed certificate, and there is no openssl in the container.
#     Render terminates TLS for you.
#   · The health check hits /api/health, which is public and actually queries
#     the database. /api/network needs a session now, so using it would fail
#     every check and take a working instance out of rotation.
services:
  - type: web
    name: campus-bus
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Pin the runtime. Next 16 will not build on an older Node, and the
      # platform default can change under you.
      - key: NODE_VERSION
        value: 20.19.0

      # ---- set every one of these in the Render dashboard ----------------
      # sync:false means "ask me, do not store it in the repo".

      # Neon Postgres. Must be the POOLED string — its host contains
      # "-pooler". Without it a few hundred students signing in at 7am
      # exhaust the connection limit and everyone gets an error.
      - key: DATABASE_URL
        sync: false

      # Signs the login cookie. Any long random string. Changing it signs
      # everyone out, so set it once and leave it.
      - key: AUTH_SECRET
        generateValue: true

      # Web push. Generate the pair once, locally:
      #   node -e "console.log(require('web-push').generateVAPIDKeys())"
      # Without these the app still works; the notifications card hides
      # itself rather than offering something that cannot be delivered.
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:transport@svpcet.ac.in

      # The transport office account's password. Used by the seed and reset
      # scripts, not by the running server — but set it so a re-seed does
      # not quietly restore the default that is printed in this repo.
      - key: ADMIN_PASSWORD
        sync: false
